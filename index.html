<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

   
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;

        background-image: url('./fundo.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .container {
        width: 400px;
        max-width: 90%;
        padding: 40px;

        background: rgba(255, 255, 255, 0.88);
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #555;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.9);
    }

    input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #5568d8;
        transform: translateY(-1px);
    }

    .msg {
        display: none;
        text-align: center;
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 8px;
    }

    .msg.erro {
        display: block;
        background: #ffe0e0;
        color: #c0392b;
    }

    .msg.sucesso {
        display: block;
        background: #e0ffe0;
        color: #27ae60;
    }

    @media (max-width: 500px) {
        .container {
            width: 100%;
            padding: 30px 20px;
        }
    }
</style>
</head>

<body>

    <div class="container">
    <!-- <h2>Crie sua conta</h2> -->

       <!-- <div id="msg" class="msg"></div> -->
        <div id="msg" class="msg"></div>

        <form onsubmit="fazerCadastro(event)">

            <label for="cad-email">E-mail</label>
<input
    type="email"
    id="cad-email"
    placeholder="Digite seu e-mail"
    required
>

<label for="cad-nome">Senha</label>
<input
    type="password"
    id="cad-nome"
    placeholder="Senha"
    required
>

<button type="submit">Login</button>

           <!-- <label for="cad-email">E-mail</label>
            <input
                type="email"
                id="cad-email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="cad-senha">Senha</label>
            <input
                type="password"
                id="cad-senha"
                placeholder="Senha"
                required
            >

            <button type="submit">Login</button> -->
        </form>
    </div> 

    <script>

function mostrarMsg(texto, tipo) {
    const msg = document.getElementById('msg');

    if (msg) {
        msg.textContent = texto;
        msg.className = 'msg ' + tipo;
    }
}

async function fazerCadastro(e) {
    e.preventDefault();

    const email = document.getElementById('cad-email').value.trim();
    const nome = document.getElementById('cad-nome').value.trim();

    console.log('Enviando:', { email, nome });

    try {
        const resp = await fetch('/api/cadastrar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: email,
                nome: nome
            })
        });

        const dados = await resp.json();

        mostrarMsg(
            dados.mensagem,
            dados.sucesso ? 'sucesso' : 'erro'
        );

        if (dados.sucesso) {
            setTimeout(function () {
                window.location.href = 'https://www.instagram.com/gc.eventos_?igsi=ZjQxaG53eWtrb2pr';
            }, 1500);
        }

    } catch (err) {
        console.error('Erro:', err);
        mostrarMsg('Erro ao conectar com o servidor.', 'erro');
    }
}
    </script>

</body>
</html>
