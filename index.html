<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            max-width: 90%;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .msg {
            display: none;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
        }

        .msg.erro {
            display: block;
            background: #ffe0e0;
            color: #c0392b;
        }

        .msg.sucesso {
            display: block;
            background: #e0ffe0;
            color: #27ae60;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Crie sua conta</h2>

        <div id="msg" class="msg"></div>

        <form onsubmit="fazerCadastro(event)">

            <label for="cad-email">E-mail</label>
            <input
                type="email"
                id="cad-email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="cad-senha">Senha</label>
            <input
                type="password"
                id="cad-senha"
                placeholder="Crie uma senha"
                required
            >

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        function mostrarMsg(texto, tipo) {
            const msg = document.getElementById('msg');
            msg.textContent = texto;
            msg.className = 'msg ' + tipo;
        }

        async function fazerCadastro(e) {
            e.preventDefault();

            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;

            try {
                const resp = await fetch('/api/cadastrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        senha
                    })
                });

                const dados = await resp.json();

                mostrarMsg(
                    dados.mensagem,
                    dados.sucesso ? 'sucesso' : 'erro'
                );

                if (dados.sucesso) {
                    document.getElementById('cad-email').value = '';
                    document.getElementById('cad-senha').value = '';
                }

            } catch (err) {
                mostrarMsg(
                    'Erro ao conectar com o servidor.',
                    'erro'
                );
            }
        }
    </script>

</body>
</html>
