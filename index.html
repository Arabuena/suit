<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .container {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid #ddd;
            font-weight: bold;
            color: #999;
            transition: 0.3s;
        }
        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
        }
        .form-group {
            display: none;
        }
        .form-group.active {
            display: block;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #5568d8;
        }
        .msg {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        .msg.erro {
            display: block;
            background: #ffe0e0;
            color: #c0392b;
        }
        .msg.sucesso {
            display: block;
            background: #e0ffe0;
            color: #27ae60;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sistema de Login</h2>
        <div class="tabs">
           <!-- <div class="tab active" onclick="mostrarAba('login')">Entrar</div> -->
            <div class="tab" onclick="mostrarAba('cadastro')">Login</div>
        </div>
        <!--<div id="msg" class="msg"></div>
        <div id="form-login" class="form-group active">
            <form onsubmit="fazerLogin(event)">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" placeholder="Digite seu e-mail" required>
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" placeholder="Digite sua senha" required>
                <button type="submit">Entrar</button>
            </form>
        </div>-->
        <div id="form-cadastro" class="form-group">
            <form onsubmit="fazerCadastro(event)">
               <!-- <label for="cad-nome">Nome</label> -->
                <input type="text" id="cad-nome" placeholder="Digite seu nome" required>
                <label for="cad-email">E-mail</label>
                <input type="email" id="cad-email" placeholder="Digite seu e-mail" required>
                <label for="cad-senha">Senha</label>
                <input type="password" id="cad-senha" placeholder="Crie uma senha" required>
                <button type="submit">Cadastrar</button>
            </form>
        </div> 
        <div class="footer">
            &copy; 2026 - Sistema de Login
        </div>
    </div>
    <script>
        function mostrarAba(aba) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));
            ocultarMsg();
            if (aba === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('form-login').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('form-cadastro').classList.add('active');
            }
        }
        function mostrarMsg(texto, tipo) {
            const msg = document.getElementById('msg');
            msg.textContent = texto;
            msg.className = 'msg ' + tipo;
        }
        function ocultarMsg() {
            document.getElementById('msg').className = 'msg';
        }
        async function fazerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const dados = await resp.json();
                mostrarMsg(dados.mensagem, dados.sucesso ? 'sucesso' : 'erro');
            } catch (err) {
                mostrarMsg('Erro ao conectar com o servidor.', 'erro');
            }
        }
        async function fazerCadastro(e) {
            e.preventDefault();
            const nome = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;
            try {
                const resp = await fetch('/api/cadastrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });
                const dados = await resp.json();
                mostrarMsg(dados.mensagem, dados.sucesso ? 'sucesso' : 'erro');
                if (dados.sucesso) {
                    document.getElementById('cad-nome').value = '';
                    document.getElementById('cad-email').value = '';
                    document.getElementById('cad-senha').value = '';
                    setTimeout(() => mostrarAba('login'), 1500);
                }
            } catch (err) {
                mostrarMsg('Erro ao conectar com o servidor.', 'erro');
            }
        }
    </script>
</body>
</html>
