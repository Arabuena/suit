<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários Cadastrados</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            padding: 40px;
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        .counter {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #667eea;
            color: white;
            font-weight: bold;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #f5f5ff;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 30px;
        }
        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Usuários Cadastrados</h2>
        <p class="counter" id="counter">Carregando...</p>
        <div id="tabela"></div>
        <a href="suit.html" class="voltar">Voltar ao Login</a>
    </div>

    <script>
        async function carregarUsuarios() {
            try {
                const resp = await fetch('/api/usuarios');
                const dados = await resp.json();

                if (!dados.sucesso || dados.usuarios.length === 0) {
                    document.getElementById('counter').textContent = '0 usuário(s) encontrado(s)';
                    document.getElementById('tabela').innerHTML = '<p class="empty">Nenhum usuário cadastrado ainda.</p>';
                    return;
                }

                document.getElementById('counter').textContent = dados.usuarios.length + ' usuário(s) encontrado(s)';

                let html = '<table><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Cadastro</th></tr></thead><tbody>';
                dados.usuarios.forEach(u => {
                    const data = new Date(u.criado_em).toLocaleDateString('pt-BR') + ' ' + new Date(u.criado_em).toLocaleTimeString('pt-BR');
                    html += `<tr><td>${u.id}</td><td>${u.nome}</td><td>${u.email}</td><td>${data}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('tabela').innerHTML = html;
            } catch (err) {
                document.getElementById('counter').textContent = '';
                document.getElementById('tabela').innerHTML = '<p class="empty">Erro ao carregar usuários.</p>';
            }
        }

        carregarUsuarios();
    </script>
</body>
</html>
